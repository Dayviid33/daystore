<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayStore</title>

    <!--CSS-->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <header>
        <nav class="navbar">
            <h1 class="logo">
                <a href="index.html">DayStore</a>
            </h1>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="#">Deals</a></li>
                <li><a href="#">Categories</a></li>
                <li><a href="#">Reviews</a></li>
                <li><a href="favorites.html">Favorites</a></li>    
            </ul>

            <button id="theme-toggle" class="theme-btn">
                🌙
            </button>
        </nav>
    </header>

    <main>
        <section class="hero">
    <h1>Find Your Next Favorite Tech.</h1>

    <p>
        Discover premium tech products, curated for performance,
        style, and value.
    </p>

    <div class="search-container">
        <input
            type="text"
            id="search-input"
            class="search-bar"
            placeholder="Search products..."
        >

        <button id="search-btn">
            Search
        </button>
    </div>
</section>

    <div class="categories">

        <div class="container">

        <button class="category-btn" data-category="All">All</button>

        <button class="category-btn" data-category="Gaming">Gaming</button>

        <button class="category-btn" data-category="Phones">Phones</button>

         </div>

     <select id="sort-select">
            <option value="default">Featured</option>
            <option value="rating">Highest Rated</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="name">Name (A-Z)</option>
        </select>
    </div>

   

       
    </div>

        <section class="products">
            <h2>Trending Products</h2>
                <p class="section-subtitle">
                The hottest products people are checking out right now.
                </p>   

            <div class="product-grid" id="product-grid">

            </div>
        </section>
    </main>
<script src="products.js"></script>
<script src="script.js"></script>
</body>

</html>
